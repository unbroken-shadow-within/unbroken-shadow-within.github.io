<html lang="th">
	<!--
	The web build's loading page (both presets' html/custom_html_shell), an
	arcade cabinet's screen: the PixelLab title (assets/ui/arcade_logo.png as a
	data URI: python -I tools/embed_web_logo.py puts it back after it changes),
	a segmented LOADING bar, INSERT COIN (steady: no blinking, the user's ask), 1UP / 2UP / CREDIT, a CRT
	over it all. Godot's own shell logic (missing features, the service worker,
	failure notices) is kept as it was. When the game is up the page fades out
	and the game's own title screen (ArcadeTitle) takes the PRESS START.
	-->

		<style>
:root {
	--ink: #0b0716;
	--navy: #16123c;
	--magenta: #ff2e88;
	--cyan: #3cf0ff;
	--gold: #ffd23f;
	--red: #ff3b3b;
	--pale: #e8ecff;
	--pixel: 'Press Start 2P', ui-monospace, monospace;
	--thai: 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--pale);
	background-color: var(--ink);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: clamp(14px, 3.2vh, 30px);
	visibility: hidden;
	overflow: hidden;
	background:
		radial-gradient(ellipse at 50% 38%, rgba(255, 46, 136, 0.16), transparent 60%),
		linear-gradient(180deg, #05030d 0%, #120a2a 55%, #1b0b2e 100%);
	transition: opacity 0.45s steps(6);
	z-index: 1;
}

#status.leaving {
	opacity: 0;
}

/* The neon floor running off to the horizon. */
#status .floor {
	position: absolute;
	left: -50%;
	right: -50%;
	bottom: -10%;
	height: 52%;
	background:
		repeating-linear-gradient(90deg, rgba(60, 240, 255, 0.55) 0 2px, transparent 2px 64px),
		repeating-linear-gradient(0deg, rgba(255, 46, 136, 0.55) 0 2px, transparent 2px 48px);
	transform: perspective(320px) rotateX(62deg);
	transform-origin: 50% 0;
	animation: floor 1.2s linear infinite;
	mask-image: linear-gradient(180deg, transparent, #000 35%);
	-webkit-mask-image: linear-gradient(180deg, transparent, #000 35%);
	pointer-events: none;
}

@keyframes floor {
	from { background-position: 0 0, 0 0; }
	to { background-position: 0 0, 0 48px; }
}

/* Scanlines and dark corners over everything on the page. */
#status::after {
	content: '';
	position: absolute;
	inset: 0;
	pointer-events: none;
	background:
		repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0 2px, transparent 2px 4px),
		radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
}

.corner {
	position: absolute;
	font-family: var(--pixel);
	font-size: clamp(10px, 1.8vw, 18px);
	text-shadow: 3px 3px 0 var(--ink);
	letter-spacing: 1px;
}

.corner.p1 { top: 18px; left: 20px; color: var(--red); }
.corner.p2 { top: 18px; right: 20px; color: var(--cyan); }
.corner.credit { bottom: 18px; left: 0; right: 0; text-align: center; color: var(--pale); font-size: clamp(9px, 1.4vw, 14px); }

#logo {
	position: relative;
	width: min(88vw, 738px);
	image-rendering: pixelated;
	animation: bob 1.6s steps(2) infinite;
	filter: drop-shadow(0 0 18px rgba(255, 120, 60, 0.35));
}

@keyframes bob {
	50% { transform: translateY(-1.2%); }
}

.tagline {
	position: relative;
	font-family: var(--thai);
	font-size: clamp(14px, 2.4vw, 22px);
	color: var(--pale);
	text-shadow: 2px 2px 0 var(--ink), 0 0 10px rgba(60, 240, 255, 0.35);
	text-align: center;
	padding: 0 16px;
}

/* The LOADING bar: square cells filling up, a hard offset shadow. */
#loading {
	position: relative;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 12px;
}

#bar {
	display: grid;
	grid-template-columns: repeat(20, 1fr);
	gap: 4px;
	width: min(76vw, 520px);
	padding: 6px;
	background: var(--ink);
	border: 4px solid var(--magenta);
	box-shadow: 8px 8px 0 rgba(60, 240, 255, 0.55);
}

#bar i {
	display: block;
	height: clamp(10px, 2.2vh, 18px);
	background: var(--navy);
}

#bar i.on {
	background: var(--gold);
	box-shadow: inset 0 -4px 0 #e0661d;
}

#bar i.run {
	background: var(--cyan);
}

#percent {
	font-family: var(--pixel);
	font-size: clamp(10px, 1.6vw, 14px);
	color: var(--cyan);
	text-shadow: 2px 2px 0 var(--ink);
}

#coin {
	position: relative;
	font-family: var(--pixel);
	font-size: clamp(14px, 3vw, 30px);
	color: var(--gold);
	text-shadow: 4px 4px 0 var(--ink);
}

#status-notice {
	position: relative;
	display: none;
	max-width: min(86vw, 560px);
	background-color: var(--ink);
	border: 4px solid var(--red);
	box-shadow: 8px 8px 0 rgba(255, 46, 136, 0.5);
	color: var(--pale);
	font-family: var(--thai);
	line-height: 1.5;
	padding: 1rem 1.2rem;
	text-align: center;
}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":67627568,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLoading = document.getElementById('loading');
	const statusCoin = document.getElementById('coin');
	const statusNotice = document.getElementById('status-notice');
	const bar = document.getElementById('bar');
	const percent = document.getElementById('percent');
	const CELLS = 20;
	const cells = [];
	for (let i = 0; i < CELLS; i++) {
		cells.push(bar.appendChild(document.createElement('i')));
	}

	let initializing = true;
	let statusMode = '';
	// While the size is unknown a cyan cell runs along the bar.
	let running = 0;
	const runner = setInterval(() => {
		if (statusMode !== 'progress' || percent.dataset.known === '1') {
			return;
		}
		running = (running + 1) % CELLS;
		cells.forEach((cell, i) => cell.classList.toggle('run', i === running));
	}, 90);

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const part = Math.min(current / total, 1);
			const lit = Math.floor(part * CELLS);
			percent.dataset.known = '1';
			cells.forEach((cell, i) => {
				cell.classList.remove('run');
				cell.classList.toggle('on', i < lit);
			});
			percent.textContent = 'LOADING ' + String(Math.floor(part * 100)).padStart(3, ' ') + '%';
		} else {
			percent.dataset.known = '0';
			percent.textContent = 'LOADING';
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// (the game is up: fill the bar, fade out, then go)
			setProgress(1, 1);
			clearInterval(runner);
			initializing = false;
			statusOverlay.classList.add('leaving');
			setTimeout(() => statusOverlay.remove(), 500);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusLoading.style.display = mode === 'progress' ? 'flex' : 'none';
		statusCoin.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': setProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
